<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/detalleArticulo.css">
    <title>Detalle Articulo</title>
    <!--Nunito-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <!--Open Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <div id="content-area" class="article-container">
        <h1 id="article-title" class="article-title">Cargando artículo...</h1>
        <p id="article-author" class="article-author-date">Por <span id="author-name"></span></p>
        <img id="article-image" src="" alt="Imagen del artículo" class="article-image">
        <div id="article-content" class="article-content">
            <p>Por favor, espere mientras cargamos el contenido del artículo.</p>
        </div>
        <a href="/pages/blog.html" class="lik-bottom">
            <button class="button_atras">Volver Atras</button>
        </a>
        
    </div>
    <script src="/js/detalleArticulo.js"></script>
</body>
</html>
